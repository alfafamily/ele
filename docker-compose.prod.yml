# Прод: `docker compose -f docker-compose.prod.yml up -d --build`.
# Образы собираются из исходников (без bind-mount), TLS — автоматически
# через Caddy/Let's Encrypt по домену в SITE_ADDRESS.
services:
  postgres:
    # Запинен по digest (не только тег) — воспроизводимый пул, защита от подмены
    # тега. Обновлять вместе с тегом (Dependabot docker / infra/update-image-digests.sh).
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/prod.lock
        PIP_INSTALL_FLAGS: --require-hashes
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_COLLECTSTATIC: "1"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Фоновые задачи по расписанию (миграция файлов между хранилищами,
  # автокопирование) — простой цикл с sleep, без Celery/очередей.
  # media_data общий с backend — LocalStorageBackend читает/
  # пишет те же файлы по тем же путям. entrypoint.sh (миграции)
  # здесь не запускается — backend единственный, кто мигрирует,
  # иначе гонка при одновременном старте (см. docker-compose.yml).
  cron:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/prod.lock
        PIP_INSTALL_FLAGS: --require-hashes
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - media_data:/app/media
      - ./VERSION:/app/VERSION:ro
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: []
    # Тот же непривилегированный app, что и в backend: media_data к моменту старта
    # cron уже принадлежит app (backend healthy → его entrypoint отработал chown),
    # поэтому cron просто сбрасывает привилегии через gosu, свой chown не нужен.
    # clearsessions в этом же цикле: истёкшие сессии сами из django_session не
    # уходят, а срок сессии — 90 дней (ELE_SESSION_DAYS), поэтому мусор копился
    # бы заметно. Это DELETE по индексу expire_date, обычно на нуле строк.
    command: gosu app sh -c "while true; do python manage.py migrate_storage_files; python manage.py run_scheduled_backup; python manage.py send_maintenance_reminders; python manage.py send_queued_notifications; python manage.py anonymize_due_employees; python manage.py clearsessions; sleep 60; done"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    # Caddy'ю нужен ТОЛЬКО адрес сайта ({$SITE_ADDRESS} в Caddyfile). Пробрасываем
    # именно его (docker compose подставляет значение из .env при интерполяции),
    # а не весь .env через env_file: иначе секреты БД/S3/VAPID лишний раз попадают
    # в окружение прокси-контейнера, которому они не нужны.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
