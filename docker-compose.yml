# Локальная разработка: hot reload backend (runserver) и frontend (Vite dev
# server), код смонтирован bind-volume'ами. Прод — docker-compose.prod.yml.
services:
  postgres:
    # Образы запинены по digest (см. docker-compose.prod.yml) — та же гигиена и
    # для локального стека; обновление digest'ов — infra/update-image-digests.sh.
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ele}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ele}
      POSTGRES_DB: ${POSTGRES_DB:-ele}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ele}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-ele}:${POSTGRES_PASSWORD:-ele}@postgres:5432/${POSTGRES_DB:-ele}
      # Прод-плейсхолдеры EMAIL_* из общего .env (см. .env.example) намеренно
      # игнорируются в dev — письма всегда идут через mailpit, независимо от
      # того, что записано в .env для будущего прод-деплоя.
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Фоновые задачи по расписанию (миграция файлов между хранилищами,
  # автокопирование) — простой цикл с sleep, без Celery/очередей
  # (масштаб проекта их не требует). Тот же образ, что backend, но
  # entrypoint.sh (миграции) НЕ запускается здесь — иначе два
  # процесса гоняют `migrate` одновременно и гоняются за одними таблицами
  # (реальная гонка, ловилась на этом стенде). backend — единственный, кто
  # мигрирует; cron просто ждёт его готовности.
  cron:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-ele}:${POSTGRES_PASSWORD:-ele}@postgres:5432/${POSTGRES_DB:-ele}
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: []
    # Непривилегированный app (как в backend): media к старту cron уже принадлежит
    # app (backend healthy → его entrypoint отработал chown), gosu сбрасывает
    # привилегии, свой chown cron не делает.
    command: gosu app sh -c "while true; do python manage.py migrate_storage_files; python manage.py run_scheduled_backup; python manage.py send_maintenance_reminders; python manage.py anonymize_due_employees; sleep 60; done"

  frontend:
    image: node:22-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    expose:
      - "5173"

  mailpit:
    # dev-only; digest фиксирует конкретный образ вместо плавающего :latest.
    image: axllent/mailpit:latest@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    expose:
      - "1025"
    ports:
      - "8025:8025" # веб-интерфейс писем — см.

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    volumes:
      - ./infra/Caddyfile.dev:/etc/caddy/Caddyfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
