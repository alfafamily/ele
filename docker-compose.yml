# Локальная разработка: hot reload backend (runserver) и frontend (Vite dev
# server), код смонтирован bind-volume'ами. Прод — docker-compose.prod.yml.
services:
  postgres:
    # Образы запинены по digest (см. docker-compose.prod.yml) — та же гигиена и
    # для локального стека; обновление digest'ов — infra/update-image-digests.sh.
    image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ele}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ele}
      POSTGRES_DB: ${POSTGRES_DB:-ele}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ele}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
        PIP_INSTALL_FLAGS: ""
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-ele}:${POSTGRES_PASSWORD:-ele}@postgres:5432/${POSTGRES_DB:-ele}
      # Прод-плейсхолдеры EMAIL_* из общего .env (см. .env.example) намеренно
      # игнорируются в dev — письма всегда идут через mailpit, независимо от
      # того, что записано в .env для будущего прод-деплоя.
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Фоновые задачи по расписанию (миграция файлов между хранилищами,
  # автокопирование) — простой цикл с sleep, без Celery/очередей
  # (масштаб проекта их не требует). Тот же образ, что backend, но
  # entrypoint.sh (миграции) НЕ запускается здесь — иначе два
  # процесса гоняют `migrate` одновременно и гоняются за одними таблицами
  # (реальная гонка, ловилась на этом стенде). backend — единственный, кто
  # мигрирует; cron просто ждёт его готовности.
  cron:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
        PIP_INSTALL_FLAGS: ""
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-ele}:${POSTGRES_PASSWORD:-ele}@postgres:5432/${POSTGRES_DB:-ele}
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: []
    # Непривилегированный app (как в backend): media к старту cron уже принадлежит
    # app (backend healthy → его entrypoint отработал chown), gosu сбрасывает
    # привилегии, свой chown cron не делает.
    # clearsessions в этом же цикле: истёкшие сессии сами из django_session не
    # уходят, а срок сессии — 90 дней (ELE_SESSION_DAYS), поэтому мусор копился
    # бы заметно. Это DELETE по индексу expire_date, обычно на нуле строк.
    command: gosu app sh -c "while true; do python manage.py migrate_storage_files; python manage.py run_scheduled_backup; python manage.py send_maintenance_reminders; python manage.py send_queued_notifications; python manage.py anonymize_due_employees; python manage.py clearsessions; sleep 60; done"

  frontend:
    image: node:26-slim@sha256:36793bcbb160a6a16cede1e62b93f84e26b78a972a8a4c0b879c1c12f22761ec
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    expose:
      - "5173"

  mailpit:
    # dev-only; digest фиксирует конкретный образ вместо плавающего :latest.
    image: axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    expose:
      - "1025"
    ports:
      - "8025:8025" # веб-интерфейс писем — см.

  caddy:
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    volumes:
      - ./infra/Caddyfile.dev:/etc/caddy/Caddyfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
