name: CI

on:
  push:
    branches: [main]
  pull_request:

# Минимальные права GITHUB_TOKEN: CI только читает исходники, ничего не пишет
# в репозиторий/пакеты. Явно ограничиваем на уровне workflow (иначе действует
# дефолт репозитория, который может быть read/write).
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: License gate (copyleft)
        # B52 — падаем, если среди npm-зависимостей появился copyleft
        # (GPL/AGPL/LGPL/SSPL) или prod-пакет без лицензии. Разбор package-lock
        # напрямую, без внешних инструментов. Обоснование — reports/B52-licenses.md.
        run: node ../scripts/check-licenses.mjs
      - name: Lint (oxlint)
        run: npm run lint
      - name: Dead code (knip)
        # KNIP_DISABLE_RAW_TRANSFER — oxc-parser в raw-режиме резервирует ~6 ГБ
        # ArrayBuffer на файл; отключаем ради детерминизма на CI-раннерах.
        run: KNIP_DISABLE_RAW_TRANSFER=1 npx knip
      # B42 — точечные юнит-тесты чистой логики фронта (права/форматирование/
      # разбор ошибок/статусы ТО). Не дублируют E2E; конфиг — frontend/vitest.config.js.
      - name: Unit tests (vitest)
        run: npm run test:unit
      - name: Build
        run: npm run build

  backend:
    name: Backend (check + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Запинен по digest как и в compose (единый образ во всех окружениях).
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: ele
          POSTGRES_PASSWORD: ele
          POSTGRES_DB: ele
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ele"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://ele:ele@localhost:5432/ele
      DJANGO_SECRET_KEY: ci-not-a-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - name: License gate (copyleft)
        # B52 — падаем на strong-copyleft (GPL/AGPL/SSPL) среди установленных
        # дистрибутивов. LGPL (psycopg) разрешён намеренно (динамическое
        # связывание). Только importlib.metadata. Обоснование — reports/B52-licenses.md.
        run: python ../scripts/check_licenses.py
      - name: Dead code (ruff)
        run: ruff check .
      - name: Layer contract (import-linter)
        run: lint-imports
      - name: Django system checks
        run: python manage.py check
      - name: Missing migrations guard
        run: python manage.py makemigrations --check --dry-run
      # B42 — тесты под ветвевым покрытием (конфиг backend/.coveragerc:
      # branch=true, omit миграций/тестов/конфига). Порог fail-under держит
      # покрытие от регрессии: фактический уровень ~84%, порог 83% с запасом.
      - name: Tests (branch coverage)
        run: coverage run --branch manage.py test -v2
      - name: Coverage gate (fail-under)
        run: coverage report --fail-under=83

  security:
    name: Security (trivy + install.sh integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # B64 — целостность install.sh: контрольная сумма коммитится в репозиторий
      # (install.sh.sha256) и публикуется как ассет релиза; клиент может сверить
      # скачанный установщик. Гард держит сумму в синхроне: если install.sh
      # изменён без обновления суммы — CI падает (сумма перестаёт быть доверенной).
      - name: install.sh checksum in sync
        run: sha256sum -c install.sh.sha256

      # B63 — сканирование Dockerfile'ов/compose на мисконфиги. Строгий гейт
      # HIGH,CRITICAL; осознанные исключения — в .trivyignore (с обоснованием).
      - name: Trivy — misconfig (Dockerfiles/compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          # Версия trivy зафиксирована → детерминированный набор check'ов
          # мисконфига (ровно тот, что валидирован локально); БД уязвимостей
          # всё равно тянется свежая, так что новые CVE по-прежнему видны.
          version: v0.72.0
          # trivy-action кэширует БД через actions/cache (Node 20 → deprecation-warning
          # на раннере). Отключаем: БД тянется каждый прогон (~30 c) — детерминированнее.
          cache: "false"
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

      # Уязвимости зависимостей (pip/npm-lock). Полный отчёт HIGH,CRITICAL —
      # информационно, не блокирует (ignore-unfixed: без исправления смысла падать
      # нет). Отдельный шаг ниже жёстко гейтит только исправимые CRITICAL.
      - name: Trivy — vulnerabilities (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.72.0
          # trivy-action кэширует БД через actions/cache (Node 20 → deprecation-warning
          # на раннере). Отключаем: БД тянется каждый прогон (~30 c) — детерминированнее.
          cache: "false"
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy — vulnerabilities (gate on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.72.0
          # trivy-action кэширует БД через actions/cache (Node 20 → deprecation-warning
          # на раннере). Отключаем: БД тянется каждый прогон (~30 c) — детерминированнее.
          cache: "false"
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E (Playwright, B41)
    runs-on: ubuntu-latest
    # Зависание (напр. докачки браузера) должно падать быстро, а не жечь дефолтные
    # 6 часов Actions. Полный прогон укладывается в ~10 мин + запас на сборку стека.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Чистый изолированный стек: свежая БД + детерминированный сид (seed_e2e).
      # Caddy на :8080 (без SITE_ADDRESS → plain HTTP), чтобы не зависеть от TLS.
      - name: Поднять стек (postgres+backend+frontend+caddy)
        run: docker compose -p ele-b41 -f docker-compose.e2e.yml up -d --build

      - name: Дождаться готовности backend и SPA
        run: |
          for i in $(seq 1 60); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ele-b41-backend-1 2>/dev/null || echo starting)
            echo "backend health: $s"
            [ "$s" = "healthy" ] && break
            sleep 5
          done
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health/ >/dev/null && break
            echo "ждём Caddy/SPA на :8080 ($i)"; sleep 3
          done
          curl -fsS http://localhost:8080/api/auth/bootstrap/

      # Гоняем в официальном образе Playwright — браузеры уже внутри, поэтому НЕ
      # запускаем `playwright install` (его докачка Chromium/FFMPEG на раннере
      # однажды зависла на 6 ч). Тот же способ, что локальный scripts/e2e-local.sh;
      # версия образа синхронна @playwright/test в package.json.
      - name: Прогон E2E (образ Playwright, браузеры внутри)
        # npm ci ставит только @playwright/test (без докачки браузеров — они уже в
        # образе), затем прогон. Установка внутри контейнера: на раннере (чистый
        # checkout) node_modules нет, а `import '@playwright/test'` резолвится
        # относительно /work.
        run: |
          docker run --rm --network host --ipc=host \
            -e E2E_BASE_URL=http://localhost:8080 -e CI=1 \
            -v "$PWD":/work -w /work \
            mcr.microsoft.com/playwright:v1.49.1-jammy \
            sh -c "npm ci && npx playwright test"

      - name: Логи стека при падении
        if: failure()
        run: docker compose -p ele-b41 -f docker-compose.e2e.yml logs --no-color --tail=300

      - name: Загрузить отчёт Playwright (артефакт)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Погасить стек
        if: always()
        run: docker compose -p ele-b41 -f docker-compose.e2e.yml down -v
