name: Release

# Релиз выпускается пушем git-тега вида v1.2.3:
#   git tag v1.0.0 && git push origin v1.0.0
# Workflow создаёт GitHub Release с авто-сгенерированными заметками.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # B64 — целостность install.sh: гарантируем, что коммитнутая сумма совпадает
      # с установщиком именно этого тега, и прикладываем оба файла к релизу
      # (неизменяемые ассеты релиза → проверяемая установка, см. docs/INSTALL.md).
      - name: Verify install.sh checksum
        run: sha256sum -c install.sh.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            install.sh
            install.sh.sha256
