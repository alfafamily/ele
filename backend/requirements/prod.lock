# СГЕНЕРИРОВАННЫЙ ФАЙЛ — вручную не править (B74, supply-chain hardening).
#
# Полностью залоченное дерево зависимостей прод-образа (прямые из base.txt +
# транзитивные), КАЖДЫЙ артефакт закреплён криптохешем sha256. Прод-образ ставит
# его в режиме `pip install --require-hashes` (см. backend/Dockerfile,
# docker-compose.prod.yml): pip проверяет хеш каждого скачанного колеса/архива и
# падает при несовпадении — защита от подмены пакета в цепочке поставки (аналог
# integrity в package-lock.json у фронта). Требует, чтобы ВСЕ зависимости имели
# хеш; поэтому здесь и транзитивные, и pin по точной версии.
#
# Регенерация (после правки requirements/base.txt — версии живут ТАМ, это лишь
# слепок с хешами) на python 3.14 (совпадает с рантаймом), из backend/:
#   docker run --rm --entrypoint bash -v "$PWD":/app -w /app ele-project-backend \
#     -c 'pip install -q uv && uv pip compile --generate-hashes --no-header \
#         -o requirements/prod.lock requirements/prod.txt'
# После регенерации проверить сборку прод-образа (docker-compose.prod.yml build).
