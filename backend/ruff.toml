# B36. Гейт мёртвого/мусорного кода для backend.
# Ловим только неиспользуемые импорты/переменные/переопределения — надёжные
# правила ruff с крайне низкой долей ложных срабатываний.
#
# Миграции исключены намеренно: сигнатура RunPython (`schema_editor`) и
# `apps.get_model(...)` в data-миграциях дают ложные F841/F401, а тело
# применённых миграций трогать нельзя (историч. артефакты).
extend-exclude = [".venv", "**/migrations/**"]

[lint]
select = ["F401", "F811", "F841"]
